# Docker Compose configuration for local development
# https://docs.docker.com/compose/

services:
  postgres:
    image: postgres:18-alpine
    container_name: miniclass-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miniclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniclass_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-miniclass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniclass}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: miniclass-adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
