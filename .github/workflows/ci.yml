name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: miniclass
          POSTGRES_PASSWORD: miniclass_dev_password
          POSTGRES_DB: miniclass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniclass -d miniclass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_ADMIN_DATABASE_URL: postgres://miniclass:miniclass_dev_password@localhost:5432/postgres?sslmode=disable
      TEST_DATABASE_URL: postgres://miniclass_migrator:miniclass_migrator_dev_password@localhost:5432/miniclass_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://miniclass_app:miniclass_app_dev_password@localhost:5432/miniclass_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Provision database roles
        run: |
          psql "$POSTGRES_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/scripts/init-roles.sql
          psql "$POSTGRES_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter database miniclass_test owner to miniclass_migrator"
      - name: Run backend tests
        working-directory: backend
        run: make test

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Run golangci-lint v1.64.8
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: backend

  backend-format:
    name: Backend format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Check format and vet
        working-directory: backend
        run: make format

  generated-code-drift:
    name: Generated code drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Regenerate backend artifacts
        working-directory: backend
        run: make generate
      - name: Verify OpenAPI generation is deterministic
        working-directory: backend
        run: make generated-code-drift
      - name: Reject generated drift
        run: git diff --exit-code

  migration-round-trip:
    name: Migration round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: miniclass
          POSTGRES_PASSWORD: miniclass_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniclass -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_ADMIN_DATABASE_URL: postgres://miniclass:miniclass_dev_password@localhost:5432/postgres?sslmode=disable
      MIGRATION_ROUNDTRIP_DATABASE_URL: postgres://miniclass_migrator:miniclass_migrator_dev_password@localhost:5432/miniclass_migration_roundtrip?sslmode=disable
      MIGRATION_ROUNDTRIP_ADMIN_DATABASE_URL: postgres://miniclass:miniclass_dev_password@localhost:5432/miniclass_migration_roundtrip?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Provision database roles
        run: psql "$POSTGRES_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/scripts/init-roles.sql
      - name: Run migration round-trip
        working-directory: backend
        run: ./scripts/migration-round-trip.sh

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: bun run test -- --run
      - name: Install Chromium for mobile E2E tests
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run frontend mobile E2E tests
        working-directory: frontend
        run: bun run test:e2e

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: bun run build

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: bun run lint

  repository-formatting:
    name: Repository formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check diff formatting
        run: git diff --check

  developer-tooling:
    name: Developer tooling
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_DATABASE_URL: postgres://miniclass:miniclass_dev_password@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check .env.example shell contract
        run: ( set -a; . ./.env.example; set +a )
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Provision database roles
        run: |
          psql "$POSTGRES_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/scripts/init-roles.sql
          psql "$POSTGRES_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter database miniclass owner to miniclass_migrator"
      - name: Run setup
        run: make setup
      - name: Run db-seed and retain the claim URL
        run: |
          make db-seed SEED_OWNER_SUBJECT= | tee "$RUNNER_TEMP/seed-output.log"
          claim_url="$(sed -n 's/^Owner invitation claim URL: //p' "$RUNNER_TEMP/seed-output.log")"
          test -n "$claim_url"
          echo "SMOKE_CLAIM_URL=$claim_url" >> "$GITHUB_ENV"
      - name: Run smoke test
        run: make smoke
