linters:
  enable:
    - bodyclose
    - depguard
    - sqlclosecheck

linters-settings:
  depguard:
    rules:
      main:
        list-mode: lax
        files:
          - "$all"
          - "!**/backend/internal/data/*.go"
          - "!**/backend/internal/data/**/*.go"
          - "!**/backend/internal/identity/*.go"
          - "!**/backend/internal/identity/**/*.go"
        allow:
          - "$gostd"
        deny:
          - pkg: github.com/chrismott/miniclass/internal/db/gen
            desc: generated sqlc access belongs only in internal/data
          - pkg: github.com/chrismott/miniclass/internal/data/identity
            desc: the unscoped identity accessor belongs only in internal/identity
      data-generated:
        list-mode: lax
        files:
          - "**/backend/internal/data/*.go"
          - "**/backend/internal/data/**/*.go"
        allow:
          - github.com/chrismott/miniclass/internal/db/gen$
      identity-accessor:
        list-mode: lax
        files:
          - "**/backend/internal/identity/*.go"
          - "**/backend/internal/identity/**/*.go"
        allow:
          - github.com/chrismott/miniclass/internal/data/identity$
      seed-boundary:
        list-mode: lax
        files:
          - "$all"
          - "!**/backend/cmd/seed/*.go"
          - "!**/backend/internal/seed/*.go"
          - "!**/backend/internal/seed/**/*.go"
          - "!**/backend/internal/testing/registry/*.go"
          - "!**/*_test.go"
        allow:
          - $gostd
        deny:
          - pkg: github.com/chrismott/miniclass/internal/seed
            desc: the seed corpus belongs only in cmd/seed and tests
          - pkg: github.com/chrismott/miniclass/internal/testing/factories
            desc: test and seed factories belong only in cmd/seed and test support
