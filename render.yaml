# Render Blueprint for the service topology in ADR 0018.
# Configure all secret values in Render or Supabase; do not add them here.
services:
  - type: web
    name: miniclass-api
    runtime: docker
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: AUTH_PROVIDER
        value: supabase
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: INVITATION_CLAIM_BASE_URL
        sync: false

      - key: SOLVER_BASE_URL
        sync: false
      - key: SOLVER_REQUEST_TIMEOUT
        value: 15s
      - key: TRUSTED_PROXY_CIDRS
        sync: false

  - type: pserv
    name: miniclass-solver
    runtime: docker
    region: oregon
    dockerContext: ./solver
    dockerfilePath: ./solver/Dockerfile
    healthCheckPath: /health
    autoDeploy: false

  - type: web
    name: miniclass-frontend
    runtime: static
    region: oregon
    buildCommand: cd frontend && bun install --frozen-lockfile && bun run build
    staticPublishPath: ./frontend/dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
